services:
  - type: web
    name: jk-algo-hub-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DELTA_BASE_URL
        value: https://api.india.delta.exchange
      - key: DELTA_TESTNET_BASE_URL
        value: https://cdn-ind.testnet.deltaex.org
      - key: PORT
        value: 8787
